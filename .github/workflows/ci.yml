name: Khan & Associates AI Legal Assistant CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Quality & Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Run Full Test Suite (Days 1 - 5)
        run: |
          pytest tests/ -v --durations=10

      - name: Run Red-Team Security Defense Evaluation
        run: |
          python src/security.py

      - name: Run System Evaluation & Dashboard Generation
        run: |
          python src/evaluation_suite.py

      - name: Verify Dockerfile Build
        run: |
          docker build -t khan-legal-assistant:latest .
